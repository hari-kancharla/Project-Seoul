name: ci

# Repository-owned checks that run WITHOUT a Chromium checkout or build.
#
# The native suites (`npm run test:native`, `npm run test:native:browser`) need
# the pinned external Chromium checkout and a capable macOS host, so they are
# not run here; `scripts/check-test-wiring.mjs` records that and fails if any
# other suite quietly leaves the CI path.

on:
  push:
    branches: [main, "native/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # Action versions are pinned to a major tag; tighten to a full commit SHA
      # when hardening the supply chain further.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install (lockfile)
        run: npm ci
      - name: Repository checks (scripts, json, manifest, boundary, neutrality, architecture, test wiring, syntax, protocol)
        run: npm run check
      # The next step requires a browser rather than letting the render smoke
      # report itself skipped, so resolve one FIRST and say so. The runner image
      # is expected to ship Chrome, but that is someone else's image to change:
      # if it ever stops shipping one, this step names the cause instead of
      # leaving a confusing failure inside the test suite. It uses the same
      # resolver the tests use, so the two can never disagree about what counts.
      - name: Resolve the browser the render smoke will drive
        run: |
          node -e '
            import("./apps/canvas-prototype/launch-browser.mjs").then(({findBrowserBinary, candidateBrowserPaths}) => {
              const found = findBrowserBinary();
              if (found) {
                console.log("render smoke will drive: " + found);
                return;
              }
              console.error("No browser on this runner. Looked at:");
              for (const c of candidateBrowserPaths()) console.error("  " + c);
              console.error(
                "The ubuntu runner image is expected to ship Google Chrome. If it no " +
                "longer does, install one in this job or point SEOUL_CHROME_BINARY at it - " +
                "do NOT drop SEOUL_REQUIRE_BROWSER_TESTS, which exists so the smoke " +
                "cannot go quietly unrun.");
              process.exit(1);
            });
          '
      - name: Tests (protocol, canvas, boost editor, harness, providers, reference transform)
        # Require the render smoke to actually run. Without this it would report
        # itself skipped and the suite would still be green - the exact failure
        # the skip was introduced to avoid.
        env:
          SEOUL_REQUIRE_BROWSER_TESTS: "1"
        run: npm test

  swift:
    # The overlay app, its bridge, and the coordinate/display transforms are
    # macOS-only and are not reachable from `npm test`; without this job they
    # build and test on a developer machine and nowhere else.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Swift package
        run: swift build
      - name: Swift tests (coordinate transform, display selection)
        run: swift test
