<!-- Project Seoul mark, as a favicon.
     Same geometry as seoulMark() in welcome_marks.ts, but with the accent
     baked in: a favicon cannot inherit currentColor, and a first-party Seoul
     page falling back to Chromium's generic globe is the single most visible
     "unfinished" tell in the whole window. The accent is Seoul's light-mode
     green, which holds up against both the light and dark rail. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <rect x="3" y="3" width="42" height="42" rx="13"
      fill="none" stroke="#2f6f57" stroke-width="3" opacity="0.92"/>
  <rect x="11" y="12" width="5" height="24" rx="2.5" fill="#2f6f57"/>
  <circle cx="30" cy="24" r="7.5" fill="none" stroke="#2f6f57" stroke-width="3"/>
  <circle cx="30" cy="24" r="2.5" fill="#2f6f57"/>
</svg>
