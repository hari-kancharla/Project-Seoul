<!doctype html>
<!-- Project Seoul Canvas. All UI is rendered by the packaged Lit component;
     CSP is supplied by SeoulCanvasUI and permits no inline or remote script. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Seoul</title>
    <style>
      /* Kill the UA 8px body margin. That white gutter reads as a Chromium
         contents inset between the dark vertical rail and Canvas. */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0e1924;
        color-scheme: light dark;
      }
      html {
        background: light-dark(#eef6fc, #0e1924);
      }
      body {
        background: light-dark(#eef6fc, #0e1924);
      }
      seoul-canvas-app {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <seoul-canvas-app></seoul-canvas-app>
    <script type="module" src="canvas.js"></script>
  </body>
</html>
